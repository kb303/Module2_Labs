<!doctype html>
<html>
  <head> </head>

  <body>
    <header>
      <nav>
        <!-- works like <a href="/index.html">Home</a> -->
        <a href="./index.html">Home</a>
      </nav>
    </header>

    <main>
      <form method="POST" action="http://localhost:3000/profile">
        <div>
          <label for="firstname">First name:</label>
          <input type="text" id="firstname" name="firstname" />
        </div>
        <div>
          <label for="lastname">Last name:</label>
          <input type="text" id="lastname" name="lastname" />
        </div>
        <div>
          <input
            type="radio"
            id="html"
            name="fav_coding_language"
            value="HTML"
          />
          <label for="html">HTML</label>
        </div>
        <div>
          <input type="radio" id="css" name="fav_coding_language" value="CSS" />
          <label for="css">CSS</label>
        </div>
        <div>
          <input
            type="radio"
            id="js"
            name="fav_coding_language"
            value="Javascript"
          />
          <label for="js">Javascript</label>
        </div>

        <div>
          <input type="checkbox" id="car" name="car" value="Car" />
          <label for="car">I have a car</label>
        </div>
        <div>
          <input type="checkbox" id="bike" name="bike" value="Bike" />
          <label for="bike">I have a bike</label>
        </div>
        <div>
          <input type="checkbox" id="boat" name="boat" value="Boat" />
          <label for="boat">I have a car</label>
        </div>

        <div>
          <label for="brands">Choose your car brand: </label>
          <select id="brands" name="brands">
            <option value="audi">Audi</option>
            <option value="subaru">Subaru</option>
            <option value="toyota">Toyota</option>
          </select>
        </div>
        <div>
          <button type="submit">Submit form</button>
        </div>
      </form>
    </main>

    <footer>Copyright &copy; 2024</footer>
  </body>
</html>
